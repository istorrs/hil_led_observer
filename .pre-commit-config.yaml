repos:
  - repo: local
    hooks:
      - id: ruff
        name: Ruff
        entry: ruff check .
        language: system
        pass_filenames: false
        always_run: true
      - id: mypy
        name: mypy
        entry: mypy
        language: system
        pass_filenames: false
        always_run: true
      - id: pytest
        name: unit tests
        entry: python -m pytest -q
        language: system
        pass_filenames: false
        always_run: true
