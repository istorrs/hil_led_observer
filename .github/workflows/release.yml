name: CI and release

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub Release tag to build and upload
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy --python-version "${{ matrix.python-version }}"
      - name: Test
        run: python -m pytest -q

  release:
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Check tag matches package version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import re
          import tomllib

          tag = os.environ["RELEASE_TAG"]
          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          if not re.fullmatch(r"v?[0-9]+\.[0-9]+\.[0-9]+", tag):
              raise SystemExit(f"Release tag must be MAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH: {tag}")
          if tag.removeprefix("v") != version:
              raise SystemExit(f"Tag {tag} does not match package version {version}")
          PY
      - name: Build distributions
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - name: Check installed wheel
        run: |
          python -m pip install dist/*.whl
          cd /tmp
          python -I -c 'import led_observer; from importlib.metadata import version; assert led_observer.__version__ == version("led-observer")'
      - name: Upload assets to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/*.whl dist/*.tar.gz
